<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Navy Background Gradient -->
    <linearGradient id="kuitNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020B4F" />
      <stop offset="60%" stop-color="#06125E" />
      <stop offset="100%" stop-color="#0A2FA8" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="kuitGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD066" />
      <stop offset="50%" stop-color="#F5A800" />
      <stop offset="100%" stop-color="#D99400" />
    </linearGradient>

    <!-- Subtle Swoosh Arc Gradient -->
    <linearGradient id="kuitArc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5A800" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0A2FA8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="kuitShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base Shield -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#kuitNavy)" stroke="url(#kuitGold)" stroke-width="6" />

  <!-- Dynamic Marine/Engineering Swoosh Arc Motif -->
  <path d="M 48 380 C 140 440, 320 450, 464 360 C 360 410, 200 400, 80 340 Z" fill="url(#kuitArc)" />
  <circle cx="430" cy="90" r="140" fill="#0A2FA8" opacity="0.15" />

  <!-- Group with Shadow Filter -->
  <g filter="url(#kuitShadow)">
    <!-- Stylized Modern 'K' Monogram / Crest -->
    <path d="M 96 140 L 132 140 L 132 372 L 96 372 Z" fill="#FFFFFF" />
    <path d="M 132 256 L 220 140 L 268 140 L 168 266 L 276 372 L 224 372 L 132 276 Z" fill="url(#kuitGold)" />

    <!-- RC 806865 -->
    <text x="280" y="190" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#F5A800" letter-spacing="4">RC 806865</text>

    <!-- Kuit -->
    <text x="276" y="278" font-family="'Segoe UI', Georgia, sans-serif" font-size="94" font-weight="900" fill="#FFFFFF" letter-spacing="2">Kuit</text>

    <!-- LIMITED -->
    <text x="280" y="326" font-family="'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="url(#kuitGold)" letter-spacing="10">LIMITED</text>

    <!-- Subtitle: Marine | Construction | Engineering -->
    <text x="256" y="420" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" letter-spacing="3">MARINE • CONSTRUCTION • ENGINEERING • IT</text>
  </g>
</svg>
